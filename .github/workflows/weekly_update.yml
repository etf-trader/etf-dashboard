name: Daily Dashboard Update

on:
  schedule:
    - cron: '17 21 * * *'   # 5:17PM EDT (summer)
    - cron: '17 22 * * *'   # 5:17PM EST (winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Determine NY time context
        id: nytime
        run: |
          # -0400 = EDT (summer), -0500 = EST (winter)
          NY_OFFSET=$(TZ="America/New_York" date +%z)
          NY_DOW=$(TZ="America/New_York" date +%u)   # 1=Mon ... 6=Sat, 7=Sun
          NY_HOUR=$(TZ="America/New_York" date +%H)
          SCHEDULE="${{ github.event.schedule }}"

          # Decide by DST offset, not by hour, so GitHub Actions delays
          # (which can be several hours) never cause a skipped run.
          # Exactly one of the two cron lines matches on any given day.
          SHOULD_RUN=false

          if [ "$SCHEDULE" == "17 21 * * *" ] && [ "$NY_OFFSET" == "-0400" ]; then
            SHOULD_RUN=true   # summer: 21:17 UTC = 5:17PM EDT
          elif [ "$SCHEDULE" == "17 22 * * *" ] && [ "$NY_OFFSET" == "-0500" ]; then
            SHOULD_RUN=true   # winter: 22:17 UTC = 5:17PM EST
          elif [ -z "$SCHEDULE" ]; then
            SHOULD_RUN=true   # workflow_dispatch / manual run: always allow
          fi

          if [ "$SHOULD_RUN" != "true" ]; then
            echo "Schedule '$SCHEDULE' does not match NY offset $NY_OFFSET (NY hour: $NY_HOUR). Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "run_financials=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

          # Saturday (NY time): also run financials
          if [ "$NY_DOW" == "6" ]; then
            echo "run_financials=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_financials=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.nytime.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.nytime.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.nytime.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run build_all
        if: steps.nytime.outputs.should_run == 'true'
        run: python build_all.py

      - name: Run build_financials
        if: steps.nytime.outputs.should_run == 'true' && steps.nytime.outputs.run_financials == 'true'
        run: python build_financials.py

      - name: Commit & Push
        if: steps.nytime.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_analysis/
          git diff --cached --quiet || git commit -m "auto: update dashboard $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')"
          git pull --rebase --autostash origin main
          git push
